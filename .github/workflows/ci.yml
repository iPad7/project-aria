name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    # 통합 테스트가 타는 실제 인프라. docker-compose.yml과 같은 이미지·같은 포트라
    # 로컬에서 본 것과 CI가 보는 것이 어긋나지 않는다. 앱 기본 설정(config.Settings)이
    # 이미 localhost의 이 포트들을 가리키므로 env override가 필요 없다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aria -d aria"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      kafka:
        image: apache/kafka:3.8.0 # KRaft 단일 노드
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          # 클라이언트(러너 호스트)가 실제로 붙는 주소를 광고해야 한다. 컨테이너
          # 이름을 광고하면 부트스트랩은 되고 그 다음 메타데이터에서 끊긴다.
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        # 헬스체크가 있어야 GitHub이 컨테이너가 준비될 때까지 스텝 시작을 미룬다.
        # 앞선 스텝들이 벌어 주는 시간에 기대면 러너가 빠른 날 깨진다.
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (workspace + dev)
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Import boundaries (aria)
        run: uv run lint-imports --config apps/aria/.importlinter

      - name: Import boundaries (payments)
        run: uv run lint-imports --config apps/payments/.importlinter

      - name: Tests
        run: uv run pytest

      # 스키마는 마이그레이션이 단일 소스다. 통합 테스트는 `create_all`을 쓰지 않으므로
      # 여기서 실패하면 마이그레이션과 모델이 어긋난 것이다.
      - name: Migrate (aria schema)
        working-directory: apps/aria
        run: uv run alembic upgrade head

      - name: Integration tests (real Postgres·Redis·Kafka)
        run: uv run pytest -m integration

      - name: Build
        run: uv build --all-packages
