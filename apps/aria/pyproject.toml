[project]
name = "aria"
version = "0.1.0"
description = "AI persona live-streaming platform (app monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "anyio>=4.0",
    "uvicorn[standard]>=0.51.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.18.5",
    "redis>=8.0.1",
    "httpx>=0.28.1",
    "openai>=1.55.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "faststream[kafka]>=0.7.2",
    "uuid-utils>=0.10.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.2.0",
]

[project.scripts]
aria = "aria:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
