[project]
name = "payments"
version = "0.1.0"
description = "Payments service (Toss saga + outbox)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "faststream[kafka]>=0.7.2",
]

[project.scripts]
payments = "payments:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
