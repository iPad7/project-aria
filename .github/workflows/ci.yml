name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync (workspace + dev)
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Import boundaries (aria)
        run: uv run lint-imports --config apps/aria/.importlinter

      - name: Import boundaries (payments)
        run: uv run lint-imports --config apps/payments/.importlinter

      - name: Tests
        run: uv run pytest

      - name: Build
        run: uv build --all-packages
