[project]
name = "aria-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/aria", "apps/payments"]

[tool.uv]
package = false

[tool.ruff.lint]
# 규칙 세트를 명시한다 — 툴 기본값이 릴리스마다 바뀌어도 CI가 흔들리지 않도록.
# (ruff 0.16이 기본 select에 I·UP을 추가하며 실제로 CI가 깨졌다. #29)
#
# E4/E7/E9 = ruff의 기본 E 하위집합. E5(E501 줄 길이)는 일부러 뺀다 — 줄 길이는
# `ruff format`이 관리하고, 포매터가 재배치하지 못하는 한국어 주석·독스트링만
# 남아 오탐이 된다.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# 워크스페이스 src 레이아웃(apps/*/src)은 자동 감지되지 않는다.
# 선언하지 않으면 자사 패키지가 서드파티로 분류돼 import 블록이 뒤섞인다.
known-first-party = ["aria", "payments"]

[tool.pytest.ini_options]
# 통합 테스트는 **기본 실행에서 뺀다.** `uv run pytest`는 인메모리 SQLite·fakeredis만
# 쓰므로 인프라 없이 돌아야 하고, 그 약속이 깨지면 아무것도 못 돌리는 체크아웃이 된다.
# 뒤에 오는 `-m`이 이기므로 `pytest -m integration`으로 반대편만 고를 수 있다.
addopts = "--import-mode=importlib -m 'not integration'"
testpaths = ["apps/aria/tests", "apps/payments/tests"]
# importlib 모드는 sys.path를 건드리지 않으므로, 테스트끼리 공유하는 하네스를
# 이름으로 import하려면 경로를 명시해야 한다(예: tests/generation_harness.py).
pythonpath = ["apps/aria/tests"]
asyncio_mode = "auto"
markers = [
    "integration: 실제 Postgres·Redis·Kafka가 떠 있어야 한다. 기본 실행에서 제외되고 CI의 별도 스텝에서 돈다",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.37.1",
    "ruff>=0.16.4",
]
