# Alembic 설정. DB URL은 여기 두지 않고 alembic/env.py가 앱 설정(ARIA_DATABASE_URL)에서
# 끌어온다 — 접속 정보의 단일 소스를 config.Settings로 유지한다.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# autogenerate된 마이그레이션을 repo 스타일에 맞게 자동 정리 — ruff format/check가
# 매번 재포매팅을 요구하는 마찰을 없앤다.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
